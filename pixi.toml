[workspace]
name = "tx_data"
version = "0.0.1"
description = "Semantic data layer for TRACERx cohort analysis"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.11.*"
polars = ">=1.0"
pyarrow = ">=15.0"
pyyaml = ">=6.0"
pytest = ">=8.0"
r-base = ">=4.0"

[pypi-dependencies]
tx_data = { path = ".", editable = true }
pyliftover = ">=0.4"

[tasks]
mocks    = "python scripts/generate_mocks.py && python scripts/generate_mocks_wgs.py"
build    = "python scripts/build_all.py"
test     = "pytest tests/ -q"
liftover = "python scripts/liftover_muttable.py"
all      = { depends-on = ["mocks", "build", "test"] }

# ALPACA's `calculate_wgd_ratios` (pandas + scipy) for the alpaca_wgd_ratios
# mock. Separate env so the default build/test env stays pandas-free.
# Needs an ALPACA-model checkout: ALPACA_SRC (default /tmp/alpaca_model).
[feature.alpaca.dependencies]
pandas = ">=3.0"
scipy = "*"

[feature.alpaca.tasks]
mocks-alpaca-wgd = "python scripts/generate_mock_alpaca_wgd.py"

[environments]
alpaca = ["alpaca"]
