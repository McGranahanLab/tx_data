# Catalog: wgd_calls_pipeline (WES). Added 2026-11-26.
name: wgd_calls_pipeline
cohort: wes
description: Per-clone WGD calls for the TRACERx WES cohort (tx842) from darwins_analysis WGD_pipeline, config.wes.toml
  (PGDD with the WES thresholds -> WGD caller steps 00-05), with every call and quality_pass, QC columns and the derived
  tree columns of wgd_calls. Same columns as wgs_wgd_calls. The previous release table stays `wgd_calls` (Piotr, 2026-11-26).
provenance:
  cohort: TRACERx 842 (WES)
  hpc_source: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tracerx_842/WGD/WGD_pipeline/05_table/wgd_calls.tsv
  hpc_source_status: 'Mock layout only. The real location is a build parameter: --source-dir <darwins_analysis>/WGD_pipeline/output/wes/wgd/05_table
    or TX_WES_WGD_CALLS_DIR.'
  format_on_source: TSV, header row
  received: '2026-11-26'
  received_via: darwins_analysis WGD_pipeline (config.wes.toml)
  canonical_format: Parquet (after build script)
  pipeline: 'WGD_pipeline (config.wes.toml): PGDD (WES thresholds 10/5/3) -> WGD steps 00-05'
primary_key:
- tumour_id
- clone
grain: one row per (WES tumour x ALPACA clone); one row with null clone for a tumour without a tree
columns:
- name: tumour_id
  type: VARCHAR
  description: Canonical tumour ID (`LTX0001-Tumour1`).
  derived: false
- name: clone
  type: VARCHAR
  description: ALPACA clone; null on the single row of a tumour without an ALPACA tree.
  derived: false
- name: parent
  type: VARCHAR
  description: Parent clone (`diploid` for the MRCA); with `clone`, the tumour's tree.
  derived: false
- name: number_of_gds_at_clone
  type: BIGINT
  description: GDs placed on this clone (not cumulative); null without calls.
  derived: false
- name: total_gds_per_tumour
  type: BIGINT
  description: GDs in the tumour; null without calls.
  derived: false
- name: quality
  type: DOUBLE
  description: Per-tumour quality score in [0, 1] (product of evidence factors).
  derived: false
- name: status
  type: VARCHAR
  description: resolved | unresolved | failed | qc_failed | no_alpaca_tree.
  derived: false
- name: class
  type: VARCHAR
  description: no_wgd | clonal_wgd | ploidy_only | mut_supported; null without calls.
  derived: false
- name: sub_class
  type: VARCHAR
  description: single subclonal GD | parallel only | sequential only | parallel + sequential.
  derived: false
- name: quality_code
  type: VARCHAR
  description: Factors that lowered `quality`, with the values that triggered them.
  derived: false
- name: worst_event_quality
  type: DOUBLE
  description: Lowest event quality among the GDs on this clone.
  derived: false
- name: worst_event_quality_code
  type: VARCHAR
  description: Factors behind `worst_event_quality`.
  derived: false
- name: n_unplaced_events
  type: BIGINT
  description: PGDD events that could not go on an ALPACA clone.
  derived: false
- name: n_rejected_events
  type: BIGINT
  description: 0 here (all calls kept); see quality_pass.
  derived: false
- name: ploidy_prior
  type: VARCHAR
  description: Borderline samples moved by the ploidy prior (applied / not_simpler).
  derived: false
- name: quality_pass
  type: BOOLEAN
  description: False when a GD on this clone has event quality below the pipeline's quality_cutoff; null without calls
    or without a cut-off.
  derived: false
- name: upstream_qc
  type: VARCHAR
  description: 'Manual QC (WES table): pass | fail | not_applied.'
  derived: false
- name: ccf_qc
  type: VARCHAR
  description: 'Truncal meanCCF > 90: pass | fail | not_evaluated | not_applied.'
  derived: false
- name: truncal_min_ccf
  type: DOUBLE
  description: Lowest truncal tree-cluster meanCCF (%).
  derived: false
- name: qc_pass
  type: BOOLEAN
  description: upstream_qc and ccf_qc both pass.
  derived: false
- name: qc_reason
  type: VARCHAR
  description: What failed QC.
  derived: false
- name: is_root
  type: BOOLEAN
  description: parent = diploid; null without calls.
  derived: true
- name: is_wgd_event_clone
  type: BOOLEAN
  description: number_of_gds_at_clone > 0; null without calls.
  derived: true
- name: cumulative_gds_to_clone
  type: BIGINT
  description: GDs from the MRCA down to this clone (inclusive); null without calls.
  derived: true
- name: has_wgd_ancestor
  type: BOOLEAN
  description: cumulative_gds_to_clone > 0; null without calls.
  derived: true
