name: wgs_battenberg_inventory
cohort: wgs   # TRACERx WGS cohort (see _sources.yml cohorts)
description: |
  Per-sample inventory of Battenberg copy-number runs for the WGS cohort.
  One row per WGS tumour sample, exactly one (optimal) solution each: the
  sample's purity and ploidy, coverage, and pointers to the Battenberg
  results directory, the optimal-solution subclones file, the MSAI file and
  the mosdepth coverage summary.

  This is the entry point for every other WGS copy-number import: the
  subclones / MSAI / mosdepth files are located through the path columns
  here, not hardcoded. Path columns keep the absolute `/nemo/...` value
  (normalised); resolve them for the current build with
  `tx_data.paths.nemo_path(<path>)`, which maps into `nemo_mock/` in
  sandbox builds. They point into the canonical Battenberg output tree
  (`CN-CCF/battenberg_wgs/output`, symlinked to the run directories).

usage_rules:
  - "Fractional, sample-level copy number: use the MSAI profile (`msai_path`) by default, NOT the optimal-solution subclones file (`subclones_path`). MSAI is Battenberg CN corrected for mirrored subclonal allelic imbalance; the optimal solution is uncorrected. Use the subclones file only when the uncorrected profile is explicitly wanted."
  - "Integer, clone-specific copy number: use ALPACA, not this table's files."
  - "Purity / ploidy: use the `purity` and `ploidy` columns. The rho / psi in the `optimal_solution` label are related but different quantities; use them only when explicitly asked (parse the label on the fly)."

provenance:
  cohort: TRACERx WGS
  hpc_source: /nemo/project/proj-tracerx-lung/tctProjects/CN-CCF/wgs_resources/inventories/battenberg_output_inventory.tsv
  format_on_source: TSV, header row
  received: 2026-10-27
  received_via: Piotr (Slack DM) supplied Nemo path + 1-row head; path corrected same day
  canonical_format: Parquet (after build script)
  pipeline: Battenberg on WGS (solution label prefix `purpleDefault`) + MSAI correction; mosdepth for coverage

primary_key:
  - sample_name_hash

grain: one row per WGS tumour sample (one optimal solution per sample)

genome_build: hg38

source_columns:
  # Source → canonical renames applied by the build.
  PATIENT: wgs_tumour_label   # despite the name, a TUMOUR label (see column)
  TUMOUR_SAMPLE: sample_name_hash
  results_dir: results_dir
  optimal_solution: optimal_solution
  subclones: subclones_file
  purity: purity
  ploidy: ploidy
  msai: msai_path
  mosdepth_summary: mosdepth_summary_path
  coverage: coverage

joins:
  wes_tables:
    notes: |
      Do NOT join to WES tables on `sample_name_hash`: WGS and WES samples
      of the same biopsy carry different hashes. Patient-level comparisons
      across cohorts go through `patient_id` / `tumour_id`, and must be
      done deliberately (different assay, different genome build: WGS is
      hg38, WES is hg19 for now).

columns:
  - name: patient_id
    type: VARCHAR
    description: "Patient identifier (e.g. `LTX0002`): the `<LTX|CRUK><digits>` prefix of `wgs_tumour_label`."
    null_semantics: not_applicable
    derived: true

  - name: tumour_id
    type: VARCHAR
    description: |
      Canonical tumour identifier, consistent with WES (`LTX0001-Tumour1`;
      configured `id_convention`). Derived from `wgs_tumour_label` by
      `tx_data.ids.wgs_tumour_id`: bare `LTX0001` → `LTX0001-Tumour1`,
      `LTX0002_tumour2` → `LTX0002-Tumour2`.
    null_semantics: not_applicable
    derived: true

  - name: wgs_tumour_label
    type: VARCHAR
    description: |
      Source `PATIENT` column verbatim. Despite its name it identifies a
      TUMOUR: the bare patient id when the patient has one tumour
      (`LTX0001`, `CRUK0001`), `<patient>_tumour<n>` when they have several
      (`LTX0002_tumour1`). Same string as the Battenberg output folder name
      (`battenberg_wgs/output/<label>/`), so keep it for locating files;
      use `tumour_id` for joins. Unlike WES, single tumours carry no suffix.
    null_semantics: not_applicable
    notes: "The build fails on a value that isn't `<LTX|CRUK><digits>` with an optional `_tumour<n>` / `_tumour_<n>` suffix."

  - name: region
    type: VARCHAR
    description: "Region label (`R1`, `R2`, ...) parsed best-effort from the `-R<n>--` token of `sample_name_hash`."
    null_semantics: unknown
    derived: true
    notes: |
      Sample-name tokens are unreliable and have no closed catalogue
      (Piotr, 2026-10-27): NULL when the name doesn't follow
      `<patient>_SU_T<n>-R<n>--<hash>`. Names whose tokens disagree with
      `wgs_tumour_label` are logged; the label wins for identity.

  - name: sample_name_hash
    type: VARCHAR
    description: |
      WGS tumour sample identifier, verbatim from `TUMOUR_SAMPLE`, e.g.
      `LTX0001_SU_T1-R1--38da873ff7`. Usually the same shape as the WES
      hashes but not always; a different hash from WES for the same
      biopsy. Primary key.
    null_semantics: not_applicable

  - name: results_dir
    type: VARCHAR
    description: "Battenberg results directory (absolute `/nemo/...`, doubled slashes and trailing slash removed)."
    null_semantics: not_measured

  - name: optimal_solution
    type: VARCHAR
    description: |
      Label of the Battenberg optimal solution for this sample, e.g.
      `purpleDefault_psi3.85_rho0.27`. Also embedded in the subclones
      filename. The psi / rho tokens are NOT the sample's ploidy / purity —
      see `usage_rules`.
    null_semantics: not_measured

  - name: subclones_file
    type: VARCHAR
    description: "Bare filename of the optimal-solution subclones file (`<sample>_<solution>_subclones.txt.gz`), relative to `results_dir`."
    null_semantics: not_measured

  - name: subclones_path
    type: VARCHAR
    description: "`results_dir` / `subclones_file`: the uncorrected optimal-solution CN profile. Prefer `msai_path`."
    null_semantics: not_measured
    derived: true

  - name: purity
    type: DOUBLE
    description: "Tumour purity for this sample, in (0, 1]. Use this, not the label's rho."
    null_semantics: unknown

  - name: ploidy
    type: DOUBLE
    description: "Average tumour ploidy for this sample. Use this, not the label's psi."
    null_semantics: unknown

  - name: msai_path
    type: VARCHAR
    description: |
      Path to `MSAI/multisample_MSAI.txt` (absolute `/nemo/...`,
      normalised): Battenberg CN profiles corrected for mirrored subclonal
      allelic imbalance. The default CN source for WGS analyses.
    null_semantics: not_measured

  - name: mosdepth_summary_path
    type: VARCHAR
    description: "Path to the sample's mosdepth `.mosdepth.summary.txt` (absolute `/nemo/...`, normalised)."
    null_semantics: not_measured

  - name: coverage
    type: DOUBLE
    description: "Tumour mean sequencing depth (x) from the mosdepth summary."
    null_semantics: not_measured

relationships:
  - column: sample_name_hash
    references: "future WGS per-sample tables (wgs_*)"

scope_notes: |
  Tumour samples only (the source has no normal column). The table stores
  pointers and per-sample scalars; it does not open the referenced files.
  Their contents become separate `wgs_*` tables.

open_questions: []
