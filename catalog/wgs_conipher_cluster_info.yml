# Catalog: wgs_conipher_cluster_info (WGS). Added 2026-11-17 for the WGS WGD pipeline.
name: wgs_conipher_cluster_info
cohort: wgs
description: 'CONIPHER clusterInfo.txt of each WGS tumour (2026_08_mean_max_absent run), the columns the WGD pipeline''s
  CCF QC reads: the lowest meanCCF over truncal tree clusters must be above 90% (Piotr, 2026-11-17).'
provenance:
  cohort: TRACERx WGS
  hpc_source: /nemo/project/proj-tracerx-wgs/working/grimesk/CONIPHERwgs/2026_08_mean_max_absent/runs/cleaning_noisefloor_artefact/snv/<wgs_tumour_label>/clusterInfo.txt
  format_on_source: TSV, header row, one per tumour
  received: '2026-11-17'
  received_via: 'Piotr (Slack DM): paths, folder listings; formats as WES'
  canonical_format: Parquet (after build script)
  consumer: darwins_analysis WGD_WGS_pipeline
primary_key:
- tumour_id
- cluster_id
- sample
grain: one row per (WGS tumour x cluster x sample)
columns:
- name: tumour_id
  type: VARCHAR
  description: Canonical tumour ID (`LTX0001-Tumour1`), from the WGS inventory via the folder label.
  null_semantics: not_applicable
  derived: true
- name: patient_id
  type: VARCHAR
  description: Patient ID (`LTX0001`).
  null_semantics: not_applicable
  derived: true
- name: wgs_tumour_label
  type: VARCHAR
  description: Folder name (`LTX0001`, `LTX0104_tumour1`). For locating files only.
  null_semantics: not_applicable
  derived: true
- name: cluster_id
  type: BIGINT
  description: Source clusterID.
  null_semantics: not_applicable
  derived: false
- name: sample
  type: VARCHAR
  description: Source SAMPLE; null if the file has no SAMPLE column.
  null_semantics: missing_on_source
  derived: false
- name: sample_name_hash
  type: VARCHAR
  description: Inventory sample name matched from `sample`; null if unmatched.
  null_semantics: missing_on_source
  derived: true
- name: truncal
  type: BOOLEAN
  description: Source truncal (R logical); null for NA.
  null_semantics: missing_on_source
  derived: false
- name: tree_clust
  type: BOOLEAN
  description: 'Source treeClust: the cluster is on the tree; null for NA.'
  null_semantics: missing_on_source
  derived: false
- name: mean_ccf
  type: DOUBLE
  description: Source meanCCF, in percent (0 to ~100); null for NA (clusters off the tree).
  null_semantics: missing_on_source
  derived: false
