name: conipher_trees
description: |
  Cohort-wide CONIPHER tree bundle: per-tumour CCF-per-clone-per-region and
  per-tumour corrected clonality calls. One aggregated R RDS on Nemo; this
  table canonicalises it into two long Parquet files so Python-side analyses
  can read it without touching R, while an R-side adapter in
  ``tx800_alpaca_replica`` re-expands it to the per-tumour ``<tumour>_trees.rds``
  shape the paper's figure scripts expect.

  **STATUS 2026-10-15 — scaffold + mock.** Source path registered in
  ``_sources.yml``; structure confirmed from a single-patient example
  provided by User. Mock RDS generated by
  ``scripts/generate_mock_conipher_trees.R`` at
  ``nemo_mock/tx842_trees.RDS``. Build script (RDS → canonical parquet)
  is still **TODO** — downstream Python code should NOT depend on this
  table yet. R-side adapters in ``tx800_alpaca_replica`` can already read
  the raw RDS directly.

provenance:
  cohort: TRACERx 842 (Tx842)
  hpc_source: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tracerx_842/tx842_trees.RDS
  format_on_source: |
    R RDS. Top level is an **unnamed** list; each element is a
    per-patient-tumour named list of 15 slots:
      ccf_table_pyclone, ccf_table_absolute,
      ccf_table_pyclone_clean, ccf_table_absolute_clean,
      merged_clusters, noisy_clusters_adjusted,
      cpn_removed_clusters, tree_removed_clusters,
      graph_pyclone, parameters,
      nested_pyclone, clonality_table,
      clonality_out, clone_proportion_out,
      subclonal_expansion_score_out
    Of these, THREE are consumed by the ALPACA figure pipeline:
      $nested_pyclone$ccf_cluster_table
          matrix (clones x regions), integer "percentage" CCF
          (0..~105), rownames = clone ids as integer-ish strings
          ("1","2","3",... — NOT the "clone1" canonical form),
          colnames = region sample IDs like
          "LTX0001_SU_T1.R1..6ecf51f11b1b"
      $clonality_out$clonality_table_corrected
          data.frame same shape, values in {clonal, subclonal, absent}
          (note: "absent" is a real third value, not NA)
      $graph_pyclone$edgelength
          named numeric vector keyed by clone id ("1","2",...),
          mutational branch length (SNV count on the branch into that
          clone). Consumed by analysis_functions.R::get_clone_genomic_distances().
    Tumour identity recovered from $parameters$sampleID
    (bare-underscore form, e.g. "LTX0001_1") or from the column-name
    prefix of either table.
  received: 2026-10-15
  received_via: User (Discord) supplied Nemo path + single-patient example
  canonical_format: Parquet (planned — see expected_outputs)
  pipeline: CONIPHER cohort aggregation (upstream of ALPACA figures)

expected_outputs:
  # Two long parquets, one row per (tumour × clone × region). Split rather
  # than wide so new regions / unknown region counts don't fight the schema.
  - name: conipher_ccf
    grain: one row per (tumour × clone × region)
    columns: [tumour_id, clone, region, ccf]
    ccf_scale: percent 0..~105 (integer in source; cast to int or scale /100 at build time — decide when the loader lands)
  - name: conipher_clonality
    grain: one row per (tumour × clone × region)
    columns: [tumour_id, clone, region, clonality]
    allowed_values_for_clonality: [clonal, subclonal, absent]

id_normalisation:
  tumour_id:
    canonical: "LTX0001-Tumour1"
    source_coercions:
      - "parameters$sampleID ('LTX0001_1' — LTX _N form) → canonical via tx_data.ids"
  clone:
    canonical: "clone1"
    source_coercions:
      - "integer-ish rownames of ccf_cluster_table ('1','2',...) → 'clone{N}'"
  region:
    canonical: "<decide at build time>"
    source_coercions:
      - |
        colnames look like 'LTX0001_SU_T1.R1..6ecf51f11b1b'. Options for
        canonical: (a) full column name as region_id, (b) just the 'R{N}'
        token stripped of the suffix hash, (c) cross-reference to kallisto
        sample IDs via the hash. Decide when the loader lands.

genome_build: n/a   # tree + CCF data, no coordinates

primary_key:
  - tumour_id
  - clone
  - region

open_questions:
  - "Region id convention: full column name vs stripped `R{N}` vs cross-referenced sample id — pick before writing the loader."
  - "Does every tumour in the real RDS populate $nested_pyclone$ccf_cluster_table and $clonality_out$clonality_table_corrected? Need to assert in the loader (fail-loud on missing slots)."
  - "Any tumours in the RDS but NOT in clone_info / wgd_calls (cohort mismatch)? Join-at-build-time check will catch this."
  - "CCF scale on canonical side: keep integer % (0..~105), rescale to [0,1] float, or expose both? The paper R script does raw min/max/mean over whatever is in the matrix — rescaling must be a conscious choice."
