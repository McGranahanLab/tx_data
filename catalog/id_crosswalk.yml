name: id_crosswalk
cohort: wes   # TRACERx WES (multi-region exome) cohort (see _sources.yml cohorts)
description: |
  Patient-level TRACERx identifier crosswalk. Maps the two identifier systems
  that appear across Tx842-related assets:

    * LTX form (``LTX<NNNN>``) — used by the main Tx842 release (muttable,
      wgd_calls, ALPACA, kallisto, clinical, alphamissense).
    * CRUK form (``CRUK<NNNN>``) — TRACERx 421-era identifiers still used by
      the paper's Zenodo pack (record 15519765) and by some derived tables
      like ``clone_info``.

  One-to-one at patient level. Tumour ordinals are NOT stored here — the
  suffix on a tumour id (``_1`` / ``-Tumour1`` / ``-Cluster1``) is invariant
  across the two forms; only the patient prefix is translated. See
  ``src/tx_data/ids.py`` for the parsing + translation helpers.

provenance:
  cohort: TRACERx 842 (Tx842)
  hpc_source: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/clinical_qc/6_release/cohort/2026-06-08_LTX_CRUK_key.csv
  format_on_source: comma-separated CSV, header row
  received: 2026-09-23
  received_via: User (Discord) pointed at the release location + column semantics
  canonical_format: Parquet (after build script)
  source_root_alias: tx842_clinical_qc

primary_key:
  # Either column is uniquely identifying at patient level. Left as a
  # composite PK to document the invariant.
  - ltx_patient_id
  - cruk_patient_id

grain: one row per patient

column_renames:
  # Applied by the loader so downstream code references canonical names only.
  PatientID: ltx_patient_id            # source-side column carries the LTX identifier
  CRUK_ID: cruk_patient_id             # source-side column carries the CRUK identifier

value_normalisation:
  ltx_patient_id: |
    Must match ``^LTX\\d+$``. Loader raises if any row fails.
  cruk_patient_id: |
    Must match ``^CRUK\\d+$``. Loader raises if any row fails.

columns:
  - name: ltx_patient_id
    type: VARCHAR
    description: LTX patient identifier (``LTX0192``).
    null_semantics: not_applicable
  - name: cruk_patient_id
    type: VARCHAR
    description: CRUK patient identifier (``CRUK0090``).
    null_semantics: not_applicable

usage_examples: |
  Programmatic translation:
  ```python
  from tx_data.ids import cruk_to_ltx, ltx_to_cruk
  cruk_to_ltx("CRUK0090_1")   # -> "LTX0192-Tumour1"
  ltx_to_cruk("LTX0192-Tumour1")  # -> "CRUK0090_1"
  ```

  Bulk (Polars) via ``apply_convention`` in a build script:
  ```python
  from tx_data.ids import apply_convention
  df = df.with_columns(apply_convention(pl.col("tumour_id"), from_form="cruk"))
  ```
