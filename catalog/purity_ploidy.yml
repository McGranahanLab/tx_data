name: purity_ploidy
description: |
  Per-region (per-sample) purity and ploidy estimates for Tx842 tumour
  samples. One row per sequencing region. Values match whatever upstream
  QC pipeline produced them (likely ASCAT or Battenberg on WGS).

  The source carries only an opaque `sample_name_hash` column. The build
  script resolves each hash via `sample_hash_map` to obtain canonical
  `tumour_id` + `lesion`; the hash suffix (after `--`) is the stable join
  key against the mapping table. Samples absent from the mapping
  (typically normals / buffy coats) are dropped.

provenance:
  cohort: TRACERx 842 (Tx842)
  hpc_source: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tracerx_842/tx842_purity_ploidy.csv
  format_on_source: CSV, header row
  received: 2026-10-20
  received_via: User (Discord) supplied Nemo path + 2-row head
  canonical_format: Parquet (after build script)
  pipeline: upstream per-sample QC (ASCAT / Battenberg on WGS, TBC)
  schema_evolution: |
    2026-10-21 — switched from regex-based parsing of `sample_name_hash`
    to explicit `sample_hash_map` lookup (brittle: hashes contain
    non-hex chars, `_SU_T` is not universally present). Output column
    `region` renamed to `lesion` to reflect the mapping's semantics.

primary_key:
  - sample_name_hash

grain: one row per sequencing region (sample). A single lesion can carry
       multiple samples (multi-region sequencing), so `(tumour_id, lesion)`
       is NOT unique — only `sample_name_hash` is.

genome_build: hg19

joins:
  muttable:
    on:
      - "purity_ploidy.sample_name_hash = muttable.sample_name_hash"
    notes: "Lossless, exact — same hash across both tables (both DNA)."
  wgd_calls:
    on:
      - "purity_ploidy.tumour_id = wgd_calls.tumour_id"
    notes: "Per-tumour join; purity_ploidy's finer per-lesion grain is averaged / selected downstream."
  kallisto:
    on:
      - "purity_ploidy.sample_stem = kallisto.sample_stem"
    notes: |
      RNA↔DNA join by sample stem (everything before `--`). The hash
      suffix differs between RNA and DNA assays of the same biopsy, so
      `sample_name_hash` cannot be used for this join; the stem can.
  sample_hash_map:
    on:
      - "last token of purity_ploidy.sample_name_hash (after `--`) = sample_hash_map.sample_hash"
    notes: "Used by the build step to derive tumour_id + lesion."

id_normalisation:
  tumour_id:
    canonical: "LTX0001-Tumour1"
    source_coercions:
      - "sample_hash_map.patient_tumour (e.g. `LTX0001_tumour1`) → canonical via tx_data.ids"
  lesion:
    canonical: "lesion1"
    source_coercions:
      - "sample_hash_map.lesion verbatim"

columns:
  - name: sample_name_hash
    type: VARCHAR
    description: |
      Opaque per-sample identifier verbatim from source. Only guaranteed
      structure is `<LTX|CRUK><digits>_..._--<hash>`; the hash suffix
      after `--` is the join key against `sample_hash_map.sample_hash`.
    null_semantics: not_applicable

  - name: tumour_id
    type: VARCHAR
    description: |
      Canonical per-tumour identifier derived from `sample_hash_map` via
      `apply_convention_scalar(patient_tumour)` (e.g. `LTX0001-Tumour1`).
      Shared across every tx_data per-tumour table.
    null_semantics: not_applicable

  - name: lesion
    type: VARCHAR
    description: |
      Within-tumour lesion label from the mapping (e.g. `lesion1`,
      `lesion2`). Can repeat within a tumour: when one lesion is
      sequenced across multiple regions, each region shows up as a
      separate row with the same `(tumour_id, lesion)` and distinct
      `sample_name_hash`. Only `sample_name_hash` is unique on its own.
    null_semantics: not_applicable

  - name: sample_stem
    type: VARCHAR
    description: |
      Sample identifier with the `--<hash>` suffix stripped (e.g.
      `LTX0001_SU_T1-R1`). The stable RNA↔DNA join key: DNA and RNA
      assays of the same biopsy carry different hashes but share the
      stem. Join `purity_ploidy.sample_stem = kallisto.sample_stem` for
      per-sample RNA↔DNA matching.
    derived: true

  - name: purity
    type: DOUBLE
    description: |
      Estimated tumour-cell fraction in the sample, nominally in [0, 1].
      Low-purity samples (< ~0.2) are commonly treated as unreliable for
      downstream CN / clonality calling — advisory, not a hard filter here.
    null_semantics: unknown

  - name: ploidy
    type: DOUBLE
    description: |
      Estimated average tumour genome ploidy. ~2 for diploid tumours,
      ~4 for clonal-WGD tumours; non-integer values arise from mixed
      populations and sample purity.
    null_semantics: unknown

relationships:
  - column: sample_name_hash
    references: muttable.sample_name_hash
  - column: tumour_id
    references: wgd_calls.tumour_id

scope_notes: |
  Grain is per-sample (one row per sequencing region), not per-lesion
  and not per-tumour. A single lesion sequenced across multiple regions
  contributes several rows, each with the same `(tumour_id, lesion)` and
  its own `sample_name_hash` + purity + ploidy. For lesion- or
  tumour-level rollups the caller chooses the aggregation rule (mean /
  max purity, representative region, etc.) — the build script does not
  pre-aggregate.

open_questions:
  - "Which upstream caller produced these — ASCAT, Battenberg, Purple, or a consensus?"
  - "Is there a documented purity floor used by the lab (e.g. drop samples < 0.1)?"
  - "Are germline/normal samples excluded on source, or should the loader filter them out?"
