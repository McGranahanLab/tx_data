# _sources.yml
#
# Registry of HPC source locations for each canonical table. Build scripts
# read from here rather than hardcoding paths, so a build can be re-pointed
# (e.g. from Tx842 to a future Tx900) by editing this one file.
#
# Cohorts:
#   The lab has two sequencing cohorts, WES (multi-region exome) and WGS
#   (whole genome). Every entry under `sources:` MUST declare
#   `cohort: <key from cohorts:>`, or `cohort: reference` for
#   cohort-independent reference data (hg19 tables). Tables from different
#   cohorts must never be mixed in a join by accident; the catalog YAML of
#   each table carries the same `cohort:` field (tests enforce agreement).
#
# Path resolution (see `tx_data.paths` / `tx_data.sources`):
#   Every root below is the absolute path on Nemo. At build time it is
#   re-rooted under `nemo_root()`:
#     prod    → nemo_root = /nemo           (paths used as-is)
#     sandbox → nemo_root = <repo>/nemo_mock (nemo_mock/ mirrors /nemo 1:1)
#   e.g. /nemo/project/.../tracerx_842/WGD/... →
#        nemo_mock/project/.../tracerx_842/WGD/...
#   Entry without `source_root:` → its cohort's `source_root_default`.
#   Entry with `source_root: <alias>` → `alt_source_roots[<alias>]`.
#   `source_root: in_repo` → tx_data repo root (static reference data).
#
# Filenames starting with `_` are treated as registry/metadata by catalog.load_all()
# and are not loaded as table definitions.

cohorts:
  wes:
    id: Tx842
    human_name: TRACERx 842 (WES)
    assay: WES
    genome_build: hg19   # moving to hg38 soon (Piotr, 2026-10-27)
    description: |
      Multi-region whole-exome sequencing cohort. Every table currently in
      tx_data belongs to this cohort (confirmed by Piotr, 2026-10-27).
    source_root_default: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tracerx_842

  wgs:
    id: TBC
    human_name: TRACERx WGS (TBC)
    assay: WGS
    genome_build: hg38
    description: |
      Whole-genome sequencing cohort. Mostly single-sample tumours. Files
      live mainly under CN-CCF/wgs_resources (Piotr, 2026-10-27); assets
      elsewhere get their own `alt_source_roots` alias. WGS tables are
      named `wgs_<table>` so they never collide with a WES table name.
    source_root_default: /nemo/project/proj-tracerx-lung/tctProjects/CN-CCF/wgs_resources

# Named roots for assets that live outside a cohort's main tree. A table
# using one still declares its own `cohort:`; the alias is only a location.
alt_source_roots:
  cn_ccf_alphamissense: /nemo/project/proj-tracerx-lung/tctProjects/CN-CCF/alphamissense
  # Mets RNA-seq release lives alongside the main Tx842 release tree; same
  # top-level cluster root, different subtree. Kept as a named root so tests
  # and downstream projects don't hardcode the path.
  tx842_mets_rnaseq: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tx842_mets_rnaseq
  # Clinical / QC release tree — sits outside the main tracerx_842 release
  # subtree. Used currently by id_crosswalk; may host more clinical assets.
  tx842_clinical_qc: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/clinical_qc/6_release/cohort
  # tx842 per-patient release tree (Piotr, 2026-11-24): <patient>/mutation_clusters/tumour_<n>/
  # (PyClone/CONIPHER SCoutput) and <patient>/mutation_trees/tumour_<n>/ (CONIPHER tree outputs);
  # _aggregate/ holds the manual QC table. Different tree from the WES source_root_default.
  tx842_release: /nemo/project/proj-tracerx-lung/tracerx/_RELEASE/release_tx842
  # Canonical WGS Battenberg output tree: one subdirectory per tumour,
  # symlinked to the run directories. Relevant subdirectories: MSAI,
  # optimal_solutions, results, tree_input (ignore intermediate, logs,
  # plots). Inventory path columns already point here.
  battenberg_wgs_output: /nemo/project/proj-tracerx-lung/tctProjects/CN-CCF/battenberg_wgs/output
  # WGS CONIPHER run used by the WGD pipeline (Piotr, 2026-11-17): one folder per WGS tumour
  # label holding SCoutput.CLEAN, treeTable, allTrees, clusterInfo (not the
  # 2026_0721_updated_solutions run).
  conipher_wgs: /nemo/project/proj-tracerx-wgs/working/grimesk/CONIPHERwgs/2026_08_mean_max_absent/runs/cleaning_noisefloor_artefact/snv

sources:
  muttable:
    cohort: wes
    relative_path: tx842_mutation_table.tsv.gz
    format: tsv_gz
    header: true
    received: 2026-08-31
    notes: |
      Long format, one row per (mutation, sample) pair. Filter by is_present==True
      for "actually detected in this sample".

  wgd_calls:
    cohort: wes
    # Mock layout only: nothing is written to this folder on Nemo. The real location is a build parameter
    # (as for wgs_wgd_calls): TX_WES_WGD_CALLS_DIR or --source-dir
    # <darwins_analysis>/WGD_pipeline/output/wes/wgd/05_table (src/tx_data/builds/wgd_calls.py).
    relative_path: WGD/WGD_pipeline/05_table/wgd_calls.tsv
    format: tsv
    header: true
    received: 2026-11-26
    received_via: darwins_analysis WGD_pipeline, config.wes.toml; replaces the previous release WGD/release_tx842/WGD_calls.tsv (Piotr, 2026-11-26)
    notes: |
      Step 05 wgd_calls.tsv of the WES run of WGD_pipeline: every call (quality_pass marks the ones passing
      the quality cut-off), QC columns, qc_failed / no_alpaca_tree rows with NA calls. Tumours the pipeline
      left out are in the run's failed_tumours.tsv, not here. The mock is the pipeline's run on this repo's
      WES mock cohort (config.wes.sandbox.toml, 2026-11-26).

  alphamissense:
    cohort: wes
    source_root: cn_ccf_alphamissense                  # from alt_source_roots
    relative_path_pattern: "output/annotated_muttables/tx842/{tumour_id}_muttable_alpha.tsv"
    format: tsv                                        # plain TSV, no `##` comment lines, clean header row
    header: true
    per_tumour: true
    per_tumour_layout: flat                            # files sit directly under tx842/ (no per-tumour subdirectory)
    tumour_id_form: "LTX0001_tumour1"                  # underscore + lowercase; matches muttable, NOT wgd_calls canonical form
    received: 2026-08-31
    notes: |
      One file per tumour. Muttable-shaped TSV with the AlphaMissense
      columns appended (NOT raw VEP output). The loader reads only:
        chr, pos, var, alpha_missense, am_class
      and dedupes to per-(tumour × chr × pos × alt) because the file is
      long-form (one row per mutation × sample).

      Real column semantics:
        alpha_missense  — float score in [0, 1]; NA for non-missense.
        am_class        — raw upstream labels (DeepMind naming):
                            {ambiguous, Likely benign, Likely pathogenic,
                             not_classified, NA}
                          The build step normalises to the canonical
                          {benign, ambiguous, pathogenic, null} set so
                          downstream code doesn't need to know about the
                          naming variants:
                            Likely benign     → benign
                            Likely pathogenic → pathogenic
                            ambiguous         → ambiguous
                            not_classified    → null
                            NA / empty        → null

      Layout changed 2026-09-02 (confirmed by User): files were moved
      into an `output/` subdirectory, the per-tumour subdirectory was
      flattened, tumour_id spelling in the filename switched from
      `LTX0001-Tumour1` to `LTX0001_tumour1`, the `_muttable_annotated`
      suffix became `_muttable_alpha`. Extension `.tsv`, plain tab-separated,
      clean header row (no `##` comments, no leading `#`). File shape
      changed from raw VEP → muttable + AM: `Location` / `Allele` /
      `Consequence` / `Gene` columns no longer exist; the AM score column
      is `alpha_missense`, renamed to `am_pathogenicity` at build time.

  clinical:
    cohort: wes
    relative_path: tx842_clinical.tsv
    format: tsv
    header: true
    null_marker: "NA"
    received: 2026-08-31
    notes: |
      Per-patient. Multi-tumour patients encode two lesions on one row
      (histology1_ / histology2_); loader unpivots to per-tumour view.
      Does NOT contain purity, ploidy, TP53 status, mutation signatures, or
      survival time-to-event columns — those live elsewhere (TBC) or must
      be derived.

  driver_list:
    cohort: wes
    relative_path: drivers/tx842_driver_gene_list.tsv
    format: tsv
    header: true
    null_marker: "NA"
    received: 2026-09-01
    notes: |
      TRACERx-bespoke driver gene list. Recommended filter for SNV analyses
      is `lung_mut_driver == TRUE`. Contains both hg19 and hg38 coordinates
      (GENCODE v49). Replaces the earlier plan to use COSMIC CGC directly.

  alpaca:
    cohort: wes
    relative_path: ALPACA/output/cohort_results/all_tumours_combined.csv
    format: csv
    header: true
    received: 2026-09-03
    notes: |
      Cohort-wide CSV of per-(tumour × segment × clone) allele-specific
      integer copy numbers from ALPACA. tumour_id and clone forms match
      wgd_calls directly (canonical `LTX0001-Tumour1`, string `clone1`).
      Segment field is `<chr>_<start>_<end>` — parsed by the loader.

  alpaca_wgd_ratios:
    cohort: wes
    # Path CONFIRMED by Piotr 2026-11-09 (tracerx_842/ALPACA/output/tumour_results/<tumour>/).
    # Release run = 12-column format, consistent with all_tumours_combined.csv.
    # (An older, unused run wrote tracerx800/output/tx842/snp_filt_0_cn_rec_FFT/tumour_results/<tumour>/wgd_ratio_scores.csv.)
    relative_path_pattern: "ALPACA/output/tumour_results/{tumour_id}/wgd_ratio_scores.csv"
    format: csv
    header: true
    per_tumour: true
    per_tumour_layout: nested        # each tumour has its own `<tumour_id>/` directory
    tumour_id_form: "LTX0001-Tumour1"   # canonical; also in the file's `tumour_id` column
    received: 2026-11-07
    received_via: Piotr (lab request); format from ALPACA-model source (9d3c2f0, `alpaca wgd`); path/format confirmed by Piotr 2026-11-09
    notes: |
      Output of `alpaca wgd` (`calculate_wgd_ratios`), run per tumour on
      that tumour's ALPACA output + tree_paths.json. One row per clone:
      tumour_id, clone, parent, ratio_A, ratio_B, ratio_total,
      segments_used_{A,B,total}, weight_sum_{A,B,total}. The release run
      has all 12 columns (Piotr 2026-11-09); the loader requires all 12 and
      rejects older 4-column files (tumour_id, clone, parent, ratio_A).

  alpaca_corrected:
    cohort: wes
    # Mock layout only. The real location is a build parameter (Piotr, 2026-11-13: nothing
    # hardcoded): --source-dir or TX_ALPACA_CORRECTED_DIR (src/tx_data/builds/alpaca_corrected.py).
    relative_path: ALPACA/output/post_hoc_corrected/alpaca_corrected.parquet
    format: parquet
    received: 2026-11-13
    received_via: darwins_analysis alpaca_post_hoc_correction (Piotr's request, 2026-11-13)
    notes: |
      `alpaca` with the copy number of missing clones re-inferred from the agreed WGD calls
      (absent, GD-free clones above parallel GDs, which ALPACA's parsimony made look doubled).
      Same rows and columns as `alpaca`, plus pred_CN_A_original, pred_CN_B_original, corrected.

  alpaca_wgd_ratios_corrected:
    cohort: wes
    # Mock layout only; real location = build parameter (see alpaca_corrected).
    relative_path: ALPACA/output/post_hoc_corrected/wgd_ratios_corrected.tsv
    format: tsv
    header: true
    received: 2026-11-13
    received_via: darwins_analysis alpaca_post_hoc_correction (Piotr's request, 2026-11-13)
    notes: |
      ALPACA's 12-column WGD ratios recomputed (port of `calculate_wgd_ratios`) from
      `alpaca_corrected`. One row per (tumour, clone) for tumours the correction ran on.

  clone_proportions:
    cohort: wes
    relative_path_pattern: "ALPACA/input/{tumour_id}/cp_table.csv"
    format: csv
    header: true
    per_tumour: true
    per_tumour_layout: nested        # each tumour has its own `<tumour_id>/` directory
    tumour_id_form: "LTX0001-Tumour1"   # canonical hyphen + capital T; matches wgd_calls
    received: 2026-09-09
    notes: |
      CONIPHER clone composition table — one CSV per tumour under
      `ALPACA/input/<tumour_id>/`. Wide layout: N sample columns followed
      by a trailing `clone` column; values are proportions in [0, 1]. The
      loader melts to long canonical form and derives tumour_id from the
      containing directory name.

  conipher_mutations:
    cohort: wes
    source_root: tx842_release
    relative_path_pattern: "{patient_id}/mutation_clusters/tumour_{tumour_n}/{patient_id}_{tumour_n}.SCoutput.CLEAN.tsv"
    relative_path_pattern_tree_table: "{patient_id}/mutation_trees/tumour_{tumour_n}/treeTable.tsv"
    format: tsv
    header: true
    per_tumour: true
    per_tumour_layout: nested        # <patient>/mutation_clusters/tumour_<n>/
    per_tumour_discovery: folder listing (<patient>/mutation_clusters/tumour_<n>/)
    tumour_id_form: "path LTX0001 + tumour_1; CASE_ID LTX0001_1"
    received: 2026-11-24
    received_via: Piotr (Slack DM) supplied both folder patterns, listings and the SCoutput header
    notes: |
      SCoutput.CLEAN.tsv (mutation x sample; also in the folder: DIRTY, FULL, results.tsv, PyClone RData)
      joined with treeTable.tsv (mutation_id, SAMPLE, treeCLUSTER) from the tumour's mutation_trees
      folder. WES counterpart of wgs_conipher_mutations; input of WGD step 00 (WGD_pipeline, WES config).

  conipher_tree_edges:
    cohort: wes
    source_root: tx842_release
    relative_path_pattern: "{patient_id}/mutation_trees/tumour_{tumour_n}/allTrees.txt"
    format: text
    per_tumour: true
    per_tumour_layout: nested        # <patient>/mutation_trees/tumour_<n>/
    per_tumour_discovery: folder listing (<patient>/mutation_trees/tumour_<n>/)
    received: 2026-11-24
    received_via: Piotr (Slack DM) supplied the mutation_trees folder pattern and listing
    notes: |
      CONIPHER allTrees.txt; the first (`# tree 1`) block is the default tree. WES counterpart of
      wgs_conipher_tree_edges; input of WGD step 00 (WGD_pipeline, WES config).

  conipher_cluster_info:
    cohort: wes
    source_root: tx842_release
    relative_path_pattern: "{patient_id}/mutation_trees/tumour_{tumour_n}/clusterInfo.txt"
    format: tsv
    header: true
    per_tumour: true
    per_tumour_layout: nested        # <patient>/mutation_trees/tumour_<n>/
    per_tumour_discovery: folder listing (<patient>/mutation_trees/tumour_<n>/)
    received: 2026-11-24
    received_via: Piotr (Slack DM) supplied the mutation_trees folder pattern and listing
    notes: |
      CONIPHER clusterInfo.txt (clusterID, SAMPLE, truncal, treeClust, meanCCF). WES counterpart of
      wgs_conipher_cluster_info; input of the WGD pipeline's CCF QC (WGD_pipeline, WES config).

  msai_segments:
    cohort: wes
    relative_path_pattern: "ALPACA/input/{tumour_id}/ALPACA_input_table.csv"
    format: csv
    header: true
    per_tumour: true
    per_tumour_layout: nested        # ALPACA/input/<tumour_id>/
    tumour_id_form: "LTX0001-Tumour1"
    received: 2026-11-24
    received_via: Piotr (Slack DM) - WES ALPACA folder, tables as on the WGS side
    notes: |
      ALPACA input table (tumour_id, segment, sample, cpnA, cpnB): fractional allele-specific CN per
      segment per sample from Refphase (ASCAT, then Refphase, which detects MSAI itself, so already
      MSAI-corrected; the same solution feeds CONIPHER). WES counterpart of wgs_consensus_segments
      (Battenberg + post-hoc MSAI correction); input of WGD step 00 (WGD_pipeline, WES config).
      ALPACA/input and ALPACA/output are symlinks the ALPACA pipeline does not update, so they can
      point at different ALPACA versions (Piotr, 2026-11-24); the build logs both targets.

  kallisto_counts:
    cohort: wes
    source_root: tx842_mets_rnaseq
    relative_path: _aggregate/kallisto_mat/kallisto_counts.parquet
    format: parquet
    received: 2026-09-03
    notes: |
      Wide-format parquet: one `gene_id` column + N sample columns. Sample
      column names use the same hashed form as muttable.sample_name_hash.
      Normal samples contain `_N01`; tumour samples `_T{n}-R{n}`. Combined
      with `kallisto_tpm` by the builder.

  kallisto_tpm:
    cohort: wes
    source_root: tx842_mets_rnaseq
    relative_path: _aggregate/kallisto_mat/kallisto_tpm.parquet
    format: parquet
    received: 2026-09-03
    notes: |
      Same shape as `kallisto_counts`; the loader hard-fails if gene and
      sample sets diverge between the two files.

  id_crosswalk:
    cohort: wes
    source_root: tx842_clinical_qc
    relative_path: 2026-06-08_LTX_CRUK_key.csv
    format: csv
    header: true
    received: 2026-09-23
    notes: |
      Patient-level TRACERx identifier crosswalk. Columns on source:
      `PatientID` (LTX form, e.g. `LTX0192`) and `CRUK_ID` (CRUK form,
      e.g. `CRUK0090`). One-to-one at patient level. Backs the CRUK ↔ LTX
      translation used by `tx_data.ids` and by any build that ingests
      CRUK-keyed sources (currently: clone_info).

  hg19_refgene__refgene:
    cohort: reference
    source_root: in_repo
    relative_path: references/hg19/refGene.txt.gz
    format: tsv_gz
    header: false
    received: 2026-09-23
    notes: |
      UCSC refGene table for hg19 (committed directly in tx_data under
      `references/hg19/`). Gzipped, no header. Column order:
      bin, name, chrom, strand, txStart, txEnd, cdsStart, cdsEnd, exonCount,
      exonStarts, exonEnds, score, name2, cdsStartStat, cdsEndStat, exonFrames.
      Consumed together with `hg19_refgene__cytoband` by the `hg19_refgene`
      builder.

  hg19_refgene__cytoband:
    cohort: reference
    source_root: in_repo
    relative_path: references/hg19/cytoBand.txt.gz
    format: tsv_gz
    header: false
    received: 2026-09-23
    notes: |
      UCSC cytoBand table for hg19 (committed directly in tx_data under
      `references/hg19/`). Gzipped, no header. Column order:
      chrom, chromStart, chromEnd, band_name (e.g. `p36.33`), gie_stain.

  seeding_table:
    cohort: wes
    relative_path: primary_met/tx842_primary_met_seedingTableFull.txt
    format: tsv
    header: true
    received: 2026-09-23
    notes: |
      Tab-separated text (R `write.table` with `sep="\t"`). Per-tumour
      seeding characterisation. Source `tumour_id` uses LTX bare-underscore
      form (`LTX0121_1`); loader auto-detects the flavour via
      `tx_data.ids`. Six columns: camelCase `seedingClonality`,
      `seedingPhyletic`, `individualSeedingClonality`,
      `individualSeedingPhyletic`, `nRegions`. Loader asserts that the
      two `individual_*` columns split to `n_regions` tokens.

  clone_info:
    cohort: wes
    relative_path: primary_met/tx842_primary_met_cloneInfo.df.txt
    format: tsv
    header: true
    received: 2026-09-23
    notes: |
      Tab-separated text (R data.frame written by `write.table`). Source
      `tumour_id` uses the LTX prefix but WITHOUT a `Tumour`/`Cluster` word
      — bare underscore + integer, e.g. `LTX0121_1`. The build script uses
      `tx_data.ids.apply_convention_scalar` to auto-detect the flavour;
      any of LTX-Tumour / LTX_tumour / LTX_N / LTX-Cluster / CRUK_N /
      CRUK-Cluster / CRUK-Tumour is accepted. `mutation_cluster` is
      snake_case; the classification columns are camelCase (`treeClones`,
      `seedingClones`, etc.). All rows are preserved — `treeClones == FALSE`
      clusters are real mutations that CONIPHER did not fit on the tree
      and are kept for downstream analyses that want them.

  purity_ploidy:
    cohort: wes
    relative_path: tx842_purity_ploidy.csv
    format: csv
    header: true
    received: 2026-10-20
    received_via: User (Discord) supplied Nemo path + 2-row head
    notes: |
      Per-region (sample) purity and ploidy estimates. Three columns on
      source: `sample_name_hash`, `purity`, `ploidy`. The hash follows the
      same convention as `muttable.sample_name_hash` and the kallisto
      sample columns (`LTX0001_SU_T1-R1--6ecf51f11b1b`), so the build
      script can parse (patient, tumour_ordinal, region) back out and
      derive canonical `tumour_id`.

  sample_hash_map:
    cohort: wes
    relative_path: mapping_files/tx842_samplehash_tumour_lesion_map.tsv
    format: tsv
    header: true
    received: 2026-10-21
    received_via: User (Discord) supplied Nemo path + 2-row head
    notes: |
      Authoritative crosswalk between opaque `sample_hash` (the suffix after
      `--` in `sample_name_hash`) and canonical identifiers:
        sample_hash, patient_id, patient_tumour, lesion, histology_group.
      Consumed by `tx_data.sample_map` so build scripts can look up a
      sample's tumour / lesion without regexing name tokens. Covers tumour
      samples only — normals / buffy coats are not in this file; detect
      them via the `_N<n>` substring in the sample identifier.

  conipher_trees:
    cohort: wes
    relative_path: tx842_trees.RDS                     # resolves against source_root_default
    format: rds                                        # R-native serialized object; loader uses R subprocess
    header: false
    received: 2026-10-15
    received_via: User (Discord) supplied Nemo path
    notes: |
      Single cohort-wide RDS bundle produced by CONIPHER post-processing.
      Expected (TBC — Nemo probe pending) to be a named list keyed by
      tumour_id, each element carrying at least:
        $nested_pyclone$ccf_cluster_table
        $clonality_out$clonality_table_corrected
      which `DRIVERORDERING_run_btm.R` reads to compute per-clone CCF
      metrics for the BTM step (Main Fig 4 b/c + ED Fig 6 BTM panels).

      Canonicalisation plan (deferred until probe confirms structure):
      - Emit two long parquets, `conipher_ccf.parquet` (tumour_id, clone,
        region, ccf) and `conipher_clonality.parquet` (tumour_id, clone,
        region, label ∈ {clonal, subclonal}).
      - Downstream adapter in `tx800_alpaca_replica/scripts/prep/` writes
        the per-tumour `<tumour_id>_trees.rds` files the paper's R script
        expects.

  wgs_battenberg_inventory:
    cohort: wgs
    relative_path: inventories/battenberg_output_inventory.tsv
    format: tsv
    header: true
    received: 2026-10-27
    received_via: Piotr (Slack DM) supplied Nemo path + 1-row head; path corrected same day
    notes: |
      One row per WGS tumour sample (exactly one optimal solution each). Ten columns on source: PATIENT,
      TUMOUR_SAMPLE, results_dir, optimal_solution, subclones, purity,
      ploidy, msai, mosdepth_summary, coverage. Path columns are absolute
      `/nemo/...` paths pointing into other trees (battenberg_wgs output,
      mosdepth); some contain doubled slashes (`output//LTX0001/results//`).
      `subclones` is a bare filename relative to `results_dir`. Lives in the
      WGS cohort root (CN-CCF/wgs_resources), undated filename.

  wgs_consensus_segments:
    cohort: wgs
    source_root: battenberg_wgs_output
    relative_path_pattern: "{wgs_tumour_label}/tree_input/{wgs_tumour_label}_copynumber_MSAI_adjusted_consensus_segments_tree_input.tsv"
    # Single-sample tumours: MSAI adjustment can't run, so the final file is
    # named differently (Piotr, 2026-10-28). Read when the adjusted file is absent.
    relative_path_pattern_single_sample: "{wgs_tumour_label}/tree_input/{wgs_tumour_label}_copynumber_MSAI_NOT_adjusted_segments_tree_input.tsv"
    format: tsv
    header: true
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory   # one file per distinct wgs_tumour_label
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-10-27
    received_via: Piotr (Slack DM) supplied tree_input listing + 3-row head
    notes: |
      MSAI-adjusted fractional allele-specific CN per sample on consensus
      segments (from tree_input/). Consensus segmentation: every sample of
      a tumour has the same breakpoints and segment count. Piotr's chosen
      source for the deviation-from-integer analysis (2026-10-28; replaces
      the unadjusted `_copynumber_consensus_segments_tree_input.tsv`).
      Single-sample tumours have no MSAI-adjusted file (the adjustment
      needs several samples); their final file is
      `<label>_copynumber_MSAI_NOT_adjusted_segments_tree_input.tsv`, same
      columns. Without this fallback 22/130 production tumours were
      dropped (Piotr, 2026-10-28). One row per (sample × consensus
      segment). Columns: SAMPLE, CHR, STARTPOS, ENDPOS, COPY_NUMBER_MAJOR,
      COPY_NUMBER_MINOR. Older files use COPY_NUMBER_A / COPY_NUMBER_B
      for the same two columns, always major/minor (Piotr, 2026-10-28). SAMPLE is a short form of the inventory
      sample name (`LTX0001_SU_T1.R1` vs `LTX0001_SU_T1-R1--<hash>`).
      Sibling files in tree_input/ (mutations, unadjusted segments,
      lost coverage, segmentation report) are not imported yet.

  wgs_tree_clones:
    cohort: wgs
    relative_path_pattern: "alpaca/input/{wgs_tumour_label}/tree_paths.json"
    format: json
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-10-28
    received_via: Piotr (Slack DM) - single-clone calls count clones on the tree
    notes: |
      ALPACA phylogeny input: a JSON list of paths, each a list of clone
      IDs from the trunk (MRCA) to a leaf, e.g.
      [["clone1","clone2"],["clone1","clone3"]]; a single-clone tumour is
      [["clone1"]] (format per ALPACA-model README). Clone count on the tree
      is Piotr's definition of single-clone (2026-10-28).

  wgs_clone_proportions:
    cohort: wgs
    relative_path_pattern: "alpaca/input/{wgs_tumour_label}/cp_table.csv"
    format: csv
    header: true
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-10-27
    received_via: Piotr (Slack DM) supplied directory listing; format "same as WES"
    notes: |
      ALPACA input clone composition table, same wide layout as the WES
      `clone_proportions` source (N sample columns + trailing `clone`
      column, proportions in [0, 1]). Other files in alpaca/input/<label>/
      (ALPACA_input_table.csv, ci_table.csv, phased_segs.tsv,
      precomputed_ci.tsv, segments/, reports) are not imported yet;
      tree_paths.json is `wgs_tree_clones`. ALPACA output lives in alpaca/output (structure TBC).

  wgs_conipher_mutations:
    cohort: wgs
    source_root: conipher_wgs
    relative_path_pattern: "{wgs_tumour_label}/{wgs_tumour_label}.SCoutput.CLEAN.tsv"
    relative_path_pattern_tree_table: "{wgs_tumour_label}/treeTable.tsv"
    format: tsv
    header: true
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-11-17
    received_via: Piotr (Slack DM) supplied the run path and folder listing; shape as the WES CONIPHER output
    notes: |
      SCoutput.CLEAN.tsv (mutation x sample) joined with treeTable.tsv (mutation_id, SAMPLE,
      treeCLUSTER) from the same folder. Input of WGD step 00 (WGD_pipeline, WGS config).

  wgs_conipher_tree_edges:
    cohort: wgs
    source_root: conipher_wgs
    relative_path_pattern: "{wgs_tumour_label}/allTrees.txt"
    format: text
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-11-17
    received_via: Piotr (Slack DM), example path LTX0001/allTrees.txt
    notes: |
      Edges `parent<TAB>child` per tree, `# tree N` headers; the first tree is the default.

  wgs_conipher_cluster_info:
    cohort: wgs
    source_root: conipher_wgs
    relative_path_pattern: "{wgs_tumour_label}/clusterInfo.txt"
    format: tsv
    header: true
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-11-17
    received_via: Piotr (Slack DM), example path LTX0001/clusterInfo.txt
    notes: |
      Only clusterID, SAMPLE, truncal, treeClust, meanCCF are kept (the WGD CCF QC).

  wgs_alpaca:
    cohort: wgs
    relative_path_pattern: "alpaca/output/tumour_results/{wgs_tumour_label}/ALPACA_output_{wgs_tumour_label}.parquet"
    format: parquet
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-11-17
    received_via: Piotr (Slack DM), tumour_results listing; same format as WES ALPACA output
    notes: |
      Per-tumour ALPACA clone CN (tumour_id, segment, clone, pred_CN_A, pred_CN_B), as the WES
      `all_tumours_combined.csv`. Layout: output/{all_solutions, cohort_results, reports,
      single_clone_or_sample, tumour_results}.

  wgs_alpaca_wgd_ratios:
    cohort: wgs
    relative_path_pattern: "alpaca/output/tumour_results/{wgs_tumour_label}/wgd_ratio_scores.parquet"
    format: parquet
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
    tumour_id_form: "wgs_tumour_label (LTX0001 / LTX0002_tumour1)"
    received: 2026-11-17
    received_via: Piotr (Slack DM); same 12 columns as WES wgd_ratio_scores

  alpaca_trees:
    cohort: wes
    # ALPACA's input tree, next to cp_table.csv. Location assumed from the cp_table layout (2026-11-19);
