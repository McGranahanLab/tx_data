    relative_path_pattern: "ALPACA/input/{tumour_id}/tree_paths.json"
    format: json
    per_tumour: true
    per_tumour_layout: nested
    tumour_id_form: "LTX0001-Tumour1"
    received: 2026-11-19
    received_via: Piotr (Slack DM) - trees from ALPACA input, not CONIPHER
    notes: |
      The selected tree (trunk -> leaf paths). CONIPHER outputs several alternative trees; the optimal
      one is chosen before ALPACA, so CONIPHER output is not used for trees.

  wgs_alpaca_trees:
    cohort: wgs
    relative_path_pattern: "alpaca/input/{wgs_tumour_label}/tree_paths.json"
    format: json
    per_tumour: true
    per_tumour_discovery: wgs_battenberg_inventory
