name: alpaca_corrected
cohort: wes   # TRACERx WES (multi-region exome) cohort (see _sources.yml cohorts)
description: |
  ALPACA per-clone allele-specific copy number (`alpaca`) corrected after the fact with the
  agreed WGD calls (Piotr, 2026-11-13). ALPACA knows nothing about genome doubling: when a clone
  absent from every sample has children that doubled independently (parallel GDs), parsimony puts
  one shared gain on the absent clone, which then looks doubled while its doubled children look
  unchanged. Here the copy number of such missing clones (and chains of missing, GD-free clones
  above them) is re-inferred knowing they did not double. Observed clones are never changed.
  One row per (tumour × segment × clone), exactly the rows of `alpaca`.

provenance:
  cohort: TRACERx 842 (Tx842)
  hpc_source: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tracerx_842/ALPACA/output/post_hoc_corrected/alpaca_corrected.parquet
  hpc_source_status: |
    PROPOSED (Darwin, 2026-11-13): to confirm with Piotr where the correction output is written
    on Nemo. The mock is generated by scripts/generate_mock_alpaca_corrected.py.
  format_on_source: Parquet (written by alpaca_post_hoc_correction scripts/correct_alpaca.py)
  received: 2026-11-13
  received_via: darwins_analysis alpaca_post_hoc_correction
  canonical_format: Parquet
  pipeline: |
    McGranahanLab/darwins_analysis alpaca_post_hoc_correction (apc/correct.py). A clone is corrected
    when it has cells in no sample (clone_proportions), carries no GD in the WGD calls, and a GD-carrying
    clone is reached from it through absent GD-free clones only. Deepest first; for each segment and
    allele x minimises sum_children |CN_c - 2^g_c x| + |x - CN_parent| (g_c: GDs on child c; diploid
    parent = 1); ties keep ALPACA's value. Derived columns recomputed as in `alpaca`.

primary_key:
  - tumour_id
  - segment
  - clone

grain: one row per (tumour × segment × clone), same as `alpaca`

genome_build: hg19
chr_prefix: false

joins:
  alpaca:
    on:
      - "alpaca_corrected.tumour_id = alpaca.tumour_id"
      - "alpaca_corrected.segment = alpaca.segment"
      - "alpaca_corrected.clone = alpaca.clone"
    notes: "Same rows. Where corrected = false the CN equals alpaca's."
  wgd_calls:
    on:
      - "alpaca_corrected.tumour_id = wgd_calls.tumour_id"
      - "alpaca_corrected.clone = wgd_calls.clone"

columns:
  - {name: tumour_id, type: VARCHAR, description: "Canonical tumour ID.", null_semantics: not_applicable}
  - {name: segment, type: VARCHAR, description: "As alpaca.segment (<chr>_<start>_<end>).", null_semantics: not_applicable}
  - {name: clone, type: VARCHAR, description: "As alpaca.clone.", null_semantics: not_applicable}
  - {name: pred_CN_A, type: BIGINT, description: "Allele A copy number after correction.", null_semantics: not_applicable}
  - {name: pred_CN_B, type: BIGINT, description: "Allele B copy number after correction.", null_semantics: not_applicable}
  - {name: segment_chr, type: VARCHAR, description: "As alpaca.segment_chr.", null_semantics: not_applicable}
  - {name: segment_start, type: BIGINT, description: "As alpaca.segment_start.", null_semantics: not_applicable}
  - {name: segment_end, type: BIGINT, description: "As alpaca.segment_end.", null_semantics: not_applicable}
  - {name: total_cn, type: BIGINT, description: "pred_CN_A + pred_CN_B (corrected).", null_semantics: not_applicable, derived: true}
  - {name: minor_cn, type: BIGINT, description: "min(pred_CN_A, pred_CN_B) (corrected).", null_semantics: not_applicable, derived: true}
  - {name: major_cn, type: BIGINT, description: "max(pred_CN_A, pred_CN_B) (corrected).", null_semantics: not_applicable, derived: true}
  - {name: is_homdel, type: BOOLEAN, description: "total_cn == 0 (corrected).", null_semantics: not_applicable, derived: true}
  - {name: is_loh, type: BOOLEAN, description: "minor_cn == 0 and total_cn > 0 (corrected).", null_semantics: not_applicable, derived: true}
  - {name: pred_CN_A_original, type: BIGINT, description: "alpaca.pred_CN_A before correction.", null_semantics: not_applicable}
  - {name: pred_CN_B_original, type: BIGINT, description: "alpaca.pred_CN_B before correction.", null_semantics: not_applicable}
  - {name: corrected, type: BOOLEAN, description: "Either allele changed by the correction.", null_semantics: not_applicable}

relationships:
  - column: [tumour_id, segment, clone]
    references: [alpaca.tumour_id, alpaca.segment, alpaca.clone]

scope_notes: |
  Only missing clones change (Piotr, 2026-11-13; observed clones are kept until live cases are
  checked). ALPACA vs call disagreements on observed clones (a called GD without ALPACA doubling,
  reversions to diploid) are flagged by the correction run (flags.tsv), not fixed here.
  Depends on the WGD calls used for the run; the tx_data `wgd_calls` is still a placeholder.

open_questions:
  - "Release path on Nemo (PROPOSED above)."
  - "Which WGD calls (version / quality cut-off) the release run uses; record it alongside the file."
