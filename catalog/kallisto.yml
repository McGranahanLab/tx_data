name: kallisto
cohort: wes   # TRACERx WES (multi-region exome) cohort (see _sources.yml cohorts)
description: |
  Kallisto-quantified gene-level expression for the Tx842 mets RNA-seq cohort.
  Two matched wide-format matrices: counts and TPM. Same schema — rows are
  genes, columns are sample identifiers.

  Includes every tumour-ish sample category the release carries (primary
  multi-region `_T<n>-R<n>`, lymph-node metastases `_LN<n>`, distant
  metastases, …) plus matched-normal samples. Normals are identified by
  the `_N<n>` substring in the sample identifier (reliable per User
  2026-10-21).

  Canonical identifiers are resolved via `sample_hash_map`. The mapping
  is the source of truth and covers every sample category the release
  recognises per User (2026-10-23); the build looks each sample up by
  its hash suffix (after `--`) and takes `patient_id`, `patient_tumour`,
  `lesion`, and `histology_group` directly from the row. This replaces
  the earlier stem-regex approach — real samples carry CODE segments
  the regex could not predict (`_LN02`, …).

  Samples absent from the mapping are kept with tumour-level columns
  null; the build logs a summary rather than crashing. Normals pass
  through on the `_N<n>` substring even without a mapping entry.

provenance:
  cohort: TRACERx 842 (Tx842) — mets RNA-seq release
  hpc_source_counts: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tx842_mets_rnaseq/_aggregate/kallisto_mat/kallisto_counts.parquet
  hpc_source_tpm:    /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tx842_mets_rnaseq/_aggregate/kallisto_mat/kallisto_tpm.parquet
  format_on_source: Parquet, wide (rows = genes, columns = samples + 1 `gene_id` column)
  received: 2026-09-03
  received_via: paths + schema summary sent by User (files not yet inspected)
  canonical_format: Parquet, long (after build script)
  schema_evolution: |
    2026-10-21 — moved from parsing name tokens to `sample_hash_map`
    lookup for tumour samples. Dropped derived columns `sample_type`,
    `region_code`, `tumour_ordinal`, `region_ordinal`.

    2026-10-22 — thought RNA hashes don't match the DNA mapping, so
    briefly used stem-regex parsing to recover `patient_tumour` +
    `lesion`. Added `sample_stem` as the RNA↔DNA join key.

    2026-10-23 — confirmed by User that `sample_hash_map` contains
    every sample we're considering, so returned to direct hash lookup.
    Hash miss is now non-fatal: tumour-level columns are left null and
    the build logs a summary. `sample_stem` is retained as the
    explicit RNA↔DNA join key for downstream per-biopsy matching.

primary_key:
  - sample_name_hash
  - gene_id

grain_source: one row per gene (wide format — sample columns are variable)
grain_canonical: one row per (sample × gene) after wide → long pivot

genome_build: hg19

joins:
  muttable:
    on:
      - "kallisto.sample_name_hash = muttable.sample_name_hash"
    notes: |
      Direct join when muttable has the same hash as kallisto. RNA and
      DNA assays of the same biopsy carry different hashes, so for
      per-biopsy matching use `sample_stem` instead.

  clinical:
    on:
      - "kallisto.patient_id = clinical.Patient_ID"
    notes: |
      For per-histology expression baselines. Use `is_normal == True` to build
      cohort-wide normal reference, or `is_normal == False` for cohort tumours.

  purity_ploidy:
    on:
      - "kallisto.sample_stem = purity_ploidy.sample_stem"
    notes: |
      RNA↔DNA per-sample join. The hash suffix differs between RNA and
      DNA assays of the same biopsy, so `sample_name_hash` cannot be
      used for this join; the stem (part before `--`) can.

  sample_hash_map:
    on:
      - "last token of kallisto.sample_name_hash (after `--`) = sample_hash_map.sample_hash"
    notes: |
      Used by the build step to resolve every canonical column
      (patient_id, patient_tumour, lesion, histology_group). Hash miss
      is non-fatal — see `scope_notes`.

filters_of_interest:
  tumour_only:  "is_normal == False"
  normal_only:  "is_normal == True"
  expressed:    "tpm >= 1.0"
  mapped_only:  "in_sample_map == True"

canonical_output_layout:
  long_table:
    columns:
      - sample_name_hash   # original wide-format column name, unchanged
      - sample_stem        # part before `--`, RNA↔DNA join key
      - patient_id         # from mapping, or parsed from stem prefix when missing
      - patient_tumour     # from mapping (canonicalised); null when missing
      - lesion             # from mapping; null when missing
      - histology_group    # from mapping; null when missing
      - is_normal          # True iff `_N<n>` substring present in stem
      - in_sample_map      # True iff hash suffix was found in sample_hash_map
      - gene_id
      - counts
      - tpm
    grain: one row per (sample × gene)

  paired_normals_view:
    columns:
      - patient_id
      - sample_name_hash
      - gene_id
      - tpm_normal
    grain: one row per (patient × gene) for patients with ≥1 normal sample

columns:
  - name: sample_name_hash
    type: VARCHAR
    description: |
      Full hashed sample identifier — the column header from the source wide
      table, kept verbatim. Joins directly to `muttable.sample_name_hash`
      when the two share a hash (DNA↔DNA); for RNA↔DNA, use `sample_stem`.
    null_semantics: not_applicable

  - name: sample_stem
    type: VARCHAR
    description: |
      Sample identifier with the `--<hash>` suffix stripped (e.g.
      `LTX0001_SU_T1-R1`). The stable RNA↔DNA join key.
    derived: true

  - name: patient_id
    type: VARCHAR
    description: |
      Patient identifier. Taken from `sample_hash_map` when the sample
      is in the mapping; falls back to the leading `(LTX|CRUK)<digits>`
      of the stem otherwise.
    derived: true

  - name: patient_tumour
    type: VARCHAR
    description: |
      Canonical per-tumour identifier for samples found in
      `sample_hash_map` (`apply_convention_scalar(record.patient_tumour)`;
      e.g. `LTX0001-Tumour1`). NULL for normals and for samples absent
      from the mapping.
    derived: true

  - name: lesion
    type: VARCHAR
    description: |
      Lesion label from `sample_hash_map` (e.g. `lesion1`, or whatever
      label the release assigns to a metastasis). NULL for normals and
      for samples absent from the mapping.
    derived: true

  - name: histology_group
    type: VARCHAR
    description: |
      Histology label from `sample_hash_map` (e.g. `LUAD`, `LUSC`).
      NULL for normals and for samples absent from the mapping.
    derived: true

  - name: is_normal
    type: BOOLEAN
    description: "True iff `_N<n>` substring present in `sample_stem`."
    derived: true

  - name: in_sample_map
    type: BOOLEAN
    description: |
      True iff the sample's hash suffix was found in `sample_hash_map`.
      When False, `patient_tumour` / `lesion` / `histology_group` are
      null — downstream code decides whether to filter these out.
    derived: true

  - name: gene_id
    type: VARCHAR
    description: |
      Gene identifier from the source `gene_id` column. OPEN QUESTION: Ensembl
      (`ENSG…`) or HGNC symbol? Confirm on first real-data build; the LoF
      scorer maps accordingly.
    null_semantics: not_applicable

  - name: counts
    type: DOUBLE
    description: "Kallisto `est_counts` for this (sample × gene). Can be non-integer (kallisto bootstrap-averaged)."
    null_semantics: measured_as_absent

  - name: tpm
    type: DOUBLE
    description: "Kallisto TPM for this (sample × gene)."
    null_semantics: measured_as_absent

relationships:
  - column: sample_name_hash
    references: muttable.sample_name_hash
  - column: patient_id
    references: clinical.Patient_ID
  - column: gene_id
    references: genes.ensembl_gene_id

scope_notes: |
  Two source files (counts + TPM) are combined by the builder into a single
  long canonical Parquet. Both source files are assumed to have identical
  gene and sample sets — the builder hard-fails if they diverge.

  Sample identifiers that lack a `--` hash delimiter raise — the shape
  itself is malformed and wants a human decision. Everything else
  passes through: samples absent from `sample_hash_map` are kept with
  tumour-level columns null (`in_sample_map` set to False), and the
  build logs a summary of normal vs tumour-ish misses.

open_questions:
  - "Is `gene_id` Ensembl (`ENSG…`) or HGNC symbol? Determined on first real build."
  - "Any samples in kallisto not present in muttable / wgd_calls (e.g. RNA-only patients)?"
  - "How many patients have a paired normal sample? Affects fallback for the expression posterior update."
  - "Are transcript-level results available (kallisto's native output), or only gene-level (this file)? If both, worth cataloging separately."
