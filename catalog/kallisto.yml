name: kallisto
description: |
  Kallisto-quantified gene-level expression for the Tx842 mets RNA-seq cohort.
  Two matched wide-format matrices: counts and TPM. Same schema — rows are
  genes, columns are sample identifiers.

  Includes both tumour and matched-normal samples in a single file. Normal
  samples are identified by `_N<n>` in their sample identifier (e.g.
  `LTX1358_SU_N01--<hash>`) — the reliable normal signal per User
  (2026-10-21).

  Kallisto (RNA) hashes do NOT match the DNA hashes in `sample_hash_map`.
  The stable RNA↔DNA join key is the **stem** — everything before `--`
  — because RNA and DNA assays of the same biopsy share the stem but
  carry different hashes. The build parses the stem with a regex (the
  pattern is reliable for kallisto per User 2026-10-22) to recover
  `patient_id`, `tumour_ordinal`, and `region_ordinal`; builds
  `patient_tumour` and `lesion` from them; and looks up
  `histology_group` by `patient_tumour` against `sample_hash_map`.
  Normals have `patient_id` extracted from the leading
  `(LTX|CRUK)<digits>` prefix and all tumour-level columns null.

provenance:
  cohort: TRACERx 842 (Tx842) — mets RNA-seq release
  hpc_source_counts: /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tx842_mets_rnaseq/_aggregate/kallisto_mat/kallisto_counts.parquet
  hpc_source_tpm:    /nemo/project/proj-tracerx-lung/tctProjects/lungTx/Tx842/release/tx842_mets_rnaseq/_aggregate/kallisto_mat/kallisto_tpm.parquet
  format_on_source: Parquet, wide (rows = genes, columns = samples + 1 `gene_id` column)
  received: 2026-09-03
  received_via: paths + schema summary sent by User (files not yet inspected)
  canonical_format: Parquet, long (after build script)
  schema_evolution: |
    2026-10-21 — moved from parsing name tokens to `sample_hash_map`
    lookup for tumour samples. Dropped derived columns `sample_type`,
    `region_code`, `tumour_ordinal`, `region_ordinal` in favour of
    `patient_tumour`, `lesion`, `histology_group`.

    2026-10-22 — RNA hashes don't match the DNA mapping. Reverted to
    stem-regex parsing to recover `patient_tumour` + `lesion`, with
    `histology_group` looked up by `patient_tumour` against the
    mapping. Added `sample_stem` as an explicit RNA↔DNA join key.

primary_key:
  - sample_name_hash
  - gene_id

grain_source: one row per gene (wide format — sample columns are variable)
grain_canonical: one row per (sample × gene) after wide → long pivot

genome_build: hg19

joins:
  muttable:
    on:
      - "kallisto.sample_name_hash = muttable.sample_name_hash"
    notes: |
      Direct join — kallisto's column headers preserve the full
      `sample_name_hash` form that muttable uses. Filter tumour vs normal
      via `is_normal`.

  clinical:
    on:
      - "kallisto.patient_id = clinical.Patient_ID"
    notes: |
      For per-histology expression baselines. Use `is_normal == True` to build
      cohort-wide normal reference, or `is_normal == False` for cohort tumours.

  purity_ploidy:
    on:
      - "kallisto.sample_stem = purity_ploidy.sample_stem"
    notes: |
      RNA↔DNA per-sample join. The hash suffix differs between RNA and
      DNA assays of the same biopsy, so `sample_name_hash` cannot be
      used for this join; the stem (part before `--`) can.

  sample_hash_map:
    on:
      - "kallisto.patient_tumour (via `apply_convention_scalar` from the mapping's `patient_tumour`)"
    notes: |
      kallisto cannot look up `sample_hash_map` by hash (RNA hashes
      aren't in it). The build step looks up `histology_group` by
      `patient_tumour` only; tumour / lesion are derived from the stem.

filters_of_interest:
  tumour_only:  "is_normal == False"
  normal_only:  "is_normal == True"
  expressed:    "tpm >= 1.0"

canonical_output_layout:
  long_table:
    columns:
      - sample_name_hash   # original wide-format column name, unchanged
      - sample_stem        # part before `--`, RNA↔DNA join key
      - patient_id         # parsed from stem
      - patient_tumour     # derived from stem, canonicalised; null for normals
      - lesion             # derived from stem (lesion<region_ordinal>); null for normals
      - histology_group    # looked up by patient_tumour; null for normals and RNA-only tumours
      - is_normal          # True iff `_N<n>` substring present in stem
      - gene_id
      - counts
      - tpm
    grain: one row per (sample × gene)

  paired_normals_view:
    columns:
      - patient_id
      - sample_name_hash
      - gene_id
      - tpm_normal
    grain: one row per (patient × gene) for patients with ≥1 normal sample

columns:
  - name: sample_name_hash
    type: VARCHAR
    description: |
      Full hashed sample identifier — the column header from the source wide
      table, kept verbatim. Joins directly to `muttable.sample_name_hash`.
    null_semantics: not_applicable

  - name: sample_stem
    type: VARCHAR
    description: |
      Sample identifier with the `--<hash>` suffix stripped (e.g.
      `LTX0001_SU_T1-R1`). The stable RNA↔DNA join key.
    derived: true

  - name: patient_id
    type: VARCHAR
    description: "Patient identifier parsed from the leading `(LTX|CRUK)<digits>` of the stem."
    derived: true

  - name: patient_tumour
    type: VARCHAR
    description: |
      Canonical per-tumour identifier for tumour samples (e.g.
      `LTX0001-Tumour1`, after `apply_convention_scalar`). Built from the
      stem's `_T<ordinal>-R<n>` segment. NULL for normals.
    derived: true

  - name: lesion
    type: VARCHAR
    description: |
      Lesion label (`lesion<region_ordinal>`) built from the stem's
      `-R<n>` segment. NULL for normals.
    derived: true

  - name: histology_group
    type: VARCHAR
    description: |
      Histology label from `sample_hash_map` looked up by
      `patient_tumour` (the mapping's `patient_tumour` spelling, pre
      `apply_convention_scalar`). NULL for normals and for tumours
      absent from the mapping (RNA-only patients).
    derived: true

  - name: is_normal
    type: BOOLEAN
    description: "True iff `_N<n>` substring present in `sample_stem`."
    derived: true

  - name: gene_id
    type: VARCHAR
    description: |
      Gene identifier from the source `gene_id` column. OPEN QUESTION: Ensembl
      (`ENSG…`) or HGNC symbol? Confirm on first real-data build; the LoF
      scorer maps accordingly.
    null_semantics: not_applicable

  - name: counts
    type: DOUBLE
    description: "Kallisto `est_counts` for this (sample × gene). Can be non-integer (kallisto bootstrap-averaged)."
    null_semantics: measured_as_absent

  - name: tpm
    type: DOUBLE
    description: "Kallisto TPM for this (sample × gene)."
    null_semantics: measured_as_absent

relationships:
  - column: sample_name_hash
    references: muttable.sample_name_hash
  - column: patient_id
    references: clinical.Patient_ID
  - column: gene_id
    references: genes.ensembl_gene_id

scope_notes: |
  Two source files (counts + TPM) are combined by the builder into a single
  long canonical Parquet. Both source files are assumed to have identical
  gene and sample sets — the builder hard-fails if they diverge.

  Tumour sample stems that don't match the `_T<n>-R<n>` pattern raise —
  unexpected shape wants a human decision rather than a silent drop. A
  tumour whose `patient_tumour` isn't in `sample_hash_map` is allowed
  (RNA-only patients are a documented possibility) — in that case
  `histology_group` is null and the build logs a summary.

open_questions:
  - "Is `gene_id` Ensembl (`ENSG…`) or HGNC symbol? Determined on first real build."
  - "Any samples in kallisto not present in muttable / wgd_calls (e.g. RNA-only patients)?"
  - "How many patients have a paired normal sample? Affects fallback for the expression posterior update."
  - "Are transcript-level results available (kallisto's native output), or only gene-level (this file)? If both, worth cataloging separately."
